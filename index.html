<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sednicon — Instant Vector Icons via Edge HTTP</title>
    <meta
      name="description"
      content="Sednicon is a modern, high-speed vector icon microservice serving 200,000+ SVG icons and brand logos via a single URL. Edge-deployed with sub-50ms latency, BYOK AI icon generation, and instant batch sprite export."
    />
    <meta name="keywords" content="icon API, SVG icon API, free icons, vector icons, icon CDN, brand logos API, dynamic SVG, AI icon generator, Sednicon" />
    <meta name="author" content="Sednium" />
    <link rel="canonical" href="https://sednicon.sednium.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sednicon.sednium.com/" />
    <meta property="og:title" content="Sednicon — Instant Vector Icons via Edge HTTP" />
    <meta
      property="og:description"
      content="One URL, every icon. 200,000+ SVG icons and brand logos served instantly via edge CDN. Dynamic color, size, batch sprites, and BYOK AI icon generation."
    />
    <meta property="og:image" content="https://sednicon.sednium.com/og-image.png" />
    <meta property="og:site_name" content="Sednicon" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://sednicon.sednium.com/" />
    <meta name="twitter:title" content="Sednicon — Instant Vector Icons via Edge HTTP" />
    <meta
      name="twitter:description"
      content="One URL, every icon. 200,000+ SVG icons and brand logos served instantly via edge CDN."
    />
    <meta name="twitter:image" content="https://sednicon.sednium.com/og-image.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="robots" content="index, follow" />

    <!-- Characterful, condensed display with a readable humanist UI face -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Initialization Script to avoid FOUC -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sednicon-theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
